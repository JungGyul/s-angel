{# Django messages: success/info become toasts, warning/error stay inline. #}
{% if messages %}
  <div class="messages">
    {% for message in messages %}
      {% if message.level >= 30 %}
        <div class="alert {% if message.level >= 40 %}alert--error{% else %}alert--warning{% endif %}" role="alert">
          <i class="fa-solid {% if message.level >= 40 %}fa-circle-exclamation{% else %}fa-triangle-exclamation{% endif %}" aria-hidden="true"></i>
          <span>{{ message }}</span>
        </div>
      {% else %}
        <span hidden data-toast="{{ message }}" data-toast-type="{% if message.level == 20 %}info{% else %}success{% endif %}"></span>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
