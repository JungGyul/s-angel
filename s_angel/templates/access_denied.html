{% extends "base.html" %}

{% block title %}접근 권한 없음{% endblock title %}

{% block content %}
<div class="message-page__code">403</div>
<h1 class="message-page__title">접근 권한이 없습니다</h1>
<p class="message-page__text">
  요청하신 페이지를 보려면 로그인이 필요하거나, 해당 기능을 사용할 수 있는 권한이 필요합니다.
</p>
<div class="btn-row">
  {% if user.is_authenticated %}
  <a class="btn btn--primary" href="{% url 'applications:dashboard' %}">
    <i class="fa-solid fa-house" aria-hidden="true"></i>홈으로 돌아가기
  </a>
  {% else %}
  <a class="btn btn--primary" href="{% url 'users:main' %}">
    <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>로그인 페이지로 이동
  </a>
  {% endif %}
</div>
{% endblock content %}
