{% extends "base.html" %}

{% block title %}소개{% endblock title %}

{% block content %}
<div class="cluster" style="justify-content:center;margin-bottom:var(--s-3)">
  <span class="brand__mark" style="width:48px;height:48px" aria-hidden="true"></span>
</div>
<h1 class="message-page__title">S-ANGEL</h1>
<p class="message-page__text">성균관대학교 공식 학교발전 홍보대사 에스엔젤(S-ANGEL)의 의전 신청·추첨 및 회계 관리 웹 서비스입니다.</p>
<div class="btn-row">
  {% if user.is_authenticated %}
  <a class="btn btn--primary" href="{% url 'applications:dashboard' %}">홈으로 이동</a>
  {% else %}
  <a class="btn btn--primary" href="{% url 'users:main' %}">로그인</a>
  {% endif %}
</div>
{% endblock content %}
