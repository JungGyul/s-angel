{% extends "layouts/app.html" %}

{% block title %}행사 만들기{% endblock %}
{% block page_title %}회계{% endblock %}
{% block page_class %}page page--narrow{% endblock %}

{% block content %}
<header class="page-head page-head--back">
  <a class="back-btn" href="{% url 'applications:accounting_main' %}" aria-label="뒤로 가기: 회계" title="회계"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></a>
  <div class="page-head__text">
    <h1 class="page-title">행사 만들기</h1>
    <p class="page-sub">행사를 먼저 만들고, 그 안에 수입·지출 내역을 입력합니다.</p>
  </div>
</header>

<form method="post" data-busy>
  {% csrf_token %}
  <div class="panel panel--pad">
  <div class="grid-2">
    <div class="field">
      <label class="field-label" for="budget_year">연도<span class="req" aria-hidden="true">*</span></label>
      <select id="budget_year" name="budget_year" required>
        <option value="" disabled>연도 선택</option>
        {% for y in years %}
        <option value="{{ y.id }}" {% if initial_year_id %}{% if y.id|stringformat:"s" == initial_year_id %}selected{% endif %}{% elif y.is_active %}selected{% endif %}>{{ y.year }}년{% if y.is_active %} (활성){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label class="field-label" for="date">대표 날짜<span class="req" aria-hidden="true">*</span></label>
      <input id="date" type="date" name="date" value="{% now 'Y-m-d' %}" required>
    </div>
  </div>

  <div class="field">
    <label class="field-label" for="name">행사명<span class="req" aria-hidden="true">*</span></label>
    <input id="name" type="text" name="name" maxlength="100" placeholder="예: 2026 축제 / 1학기 MT / 신입생 OT" required>
  </div>
  </div>

  <div class="form-actions form-actions--sticky">
    <button class="btn btn--primary" type="submit"><i class="fa-solid fa-check" aria-hidden="true"></i>등록</button>
  </div>
</form>
{% endblock %}
