{% extends "base.html" %}

{% block title %}요청 확인 실패 (403){% endblock title %}

{% block content %}
<div class="message-page__code">403</div>
<h1 class="message-page__title">보안 토큰이 만료되었습니다</h1>
<p class="message-page__text">
  페이지를 오래 열어두었거나 브라우저 쿠키 설정 문제로 요청을 확인하지 못했습니다. 이전 페이지로 돌아가 새로고침한 뒤 다시 시도해 주십시오.
</p>
<div class="btn-row">
  {% if user.is_authenticated %}
  <a class="btn btn--primary" href="{% url 'applications:dashboard' %}">
    <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>홈으로 돌아가기
  </a>
  {% else %}
  <a class="btn btn--primary" href="{% url 'users:main' %}">
    <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>로그인 페이지로 이동
  </a>
  {% endif %}
</div>
{% endblock content %}
